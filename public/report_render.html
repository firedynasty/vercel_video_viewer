<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes Renderer</title>
    <style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #1a1a1a;
    min-height: 100vh;
    color: white;
    padding: 20px;
}

.navbar {
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 20px;
    background: #111;
    border-bottom: 1px solid #333;
    margin: -20px -20px 16px -20px;
}

.navbar-title {
    font-size: 16px;
    font-weight: 700;
    color: #ef9a9a;
}

.font-controls {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
}

.font-btn {
    background: #B71C1C;
    color: white;
    border: none;
    border-radius: 4px;
    padding: 4px 10px;
    cursor: pointer;
    font-size: 13px;
    font-weight: bold;
    transition: background 0.2s;
}
.font-btn:hover { background: #d32f2f; }

.font-size-label {
    color: #aaa;
    font-size: 12px;
    font-family: monospace;
    min-width: 20px;
    text-align: center;
}

.back-link {
    color: #ef9a9a;
    text-decoration: none;
    font-size: 14px;
    font-weight: 600;
}
.back-link:hover { text-decoration: underline; }

.container {
    max-width: 900px;
    margin: 0 auto;
}

/* Note Loader toggle */
.toggle-btn {
    background: #2a1a1a;
    color: #ffc107;
    border: 1px solid #B71C1C;
    padding: 6px 14px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    font-weight: bold;
}
.toggle-btn:hover { background: #3a2a2a; }

.loader-content {
    display: none;
    margin-top: 12px;
    padding: 16px;
    background: #222;
    border-radius: 8px;
    border: 1px solid #333;
}

.loader-content textarea {
    width: 100%;
    min-height: 180px;
    background: #1a1a1a;
    color: #ddd;
    border: 2px solid #444;
    border-radius: 6px;
    padding: 12px;
    font-size: 13px;
    font-family: 'Consolas', 'Monaco', monospace;
    resize: vertical;
    margin-bottom: 10px;
}
.loader-content textarea:focus {
    outline: none;
    border-color: #B71C1C;
}
.loader-content textarea::placeholder { color: #555; }

.loader-actions {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.action-btn {
    border: none;
    border-radius: 6px;
    padding: 8px 16px;
    cursor: pointer;
    font-size: 13px;
    font-weight: bold;
    color: white;
    transition: opacity 0.2s;
}
.action-btn:hover { opacity: 0.85; }
.btn-render { background: #B71C1C; }
.btn-paste { background: #1565C0; }
.btn-clear { background: #555; }

/* Rendered output */
.render-output {
    margin-top: 20px;
}

.section-header {
    font-size: 1.3em;
    font-weight: 700;
    color: #ffc107;
    margin: 24px 0 12px 0;
    padding-bottom: 4px;
    border-bottom: 1px solid #333;
}
.section-header:first-child { margin-top: 0; }

.text-line {
    color: #ccc;
    font-size: 1em;
    line-height: 1.6;
    margin: 4px 0;
}

.video-block {
    margin: 12px 0;
    background: #111;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid #333;
}

.video-block video {
    width: 100%;
    display: block;
    max-height: 500px;
}

.video-title {
    padding: 8px 12px;
    font-size: 0.85em;
    color: #aaa;
    background: #1a1a1a;
    border-top: 1px solid #333;
    word-break: break-all;
}

.yt-block {
    margin: 12px 0;
    background: #111;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid #333;
}

.yt-block iframe {
    width: 100%;
    height: 400px;
    display: block;
    border: none;
}

.time-pills {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 12px;
    flex-wrap: wrap;
    background: #1a1a1a;
    border-top: 1px solid #333;
}

.time-pills-label {
    color: #ffc107;
    font-weight: 600;
    font-size: 0.8em;
    margin-right: 2px;
}

.time-pill {
    background: linear-gradient(135deg, #B71C1C, #d32f2f);
    color: white;
    border: none;
    border-radius: 14px;
    padding: 4px 12px;
    font-size: 0.85em;
    cursor: pointer;
    font-weight: 600;
    transition: opacity 0.2s;
    white-space: nowrap;
}
.time-pill:hover { opacity: 0.8; }

.add-time-btn {
    background: linear-gradient(135deg, #4caf50, #45a049);
    color: white;
    border: none;
    border-radius: 14px;
    padding: 4px 10px;
    font-size: 0.8em;
    cursor: pointer;
    font-weight: 600;
}
.add-time-btn:hover { opacity: 0.85; }

.separator {
    height: 12px;
}

@media (max-width: 600px) {
    body { padding: 10px; }
    .yt-block iframe { height: 240px; }
}
    </style>
</head>
<body>

<div class="navbar">
    <a href="index.html" class="back-link">&larr; Back</a>
    <span class="navbar-title">Notes Renderer</span>
    <div class="font-controls">
        <button class="font-btn" onclick="changeFontSize(-1)">A-</button>
        <span id="fontSizeLabel" class="font-size-label">14</span>
        <button class="font-btn" onclick="changeFontSize(1)">A+</button>
    </div>
</div>

<div class="container">

    <button class="toggle-btn" id="toggleBtn" onclick="toggleLoader()">&#9654; Note Loader</button>

    <div class="loader-content" id="loaderContent">
        <textarea id="notesInput" placeholder="Paste your notes here (text, Dropbox video links, YouTube links with timestamps)..."></textarea>
        <div class="loader-actions">
            <button class="action-btn btn-render" onclick="renderNotes()">Render</button>
            <button class="action-btn btn-paste" onclick="pasteFromClipboard()">Paste from Clipboard</button>
            <button class="action-btn btn-clear" onclick="clearAll()">Clear</button>
        </div>
    </div>

    <div class="render-output" id="renderOutput"></div>
</div>

<script>
var baseFontSize = 14;

function changeFontSize(delta) {
    baseFontSize = Math.max(8, Math.min(28, baseFontSize + delta));
    document.getElementById('fontSizeLabel').textContent = baseFontSize;
    document.body.style.fontSize = baseFontSize + 'px';
}

function toggleLoader() {
    var c = document.getElementById('loaderContent');
    var btn = document.getElementById('toggleBtn');
    if (c.style.display === 'none' || c.style.display === '') {
        c.style.display = 'block';
        btn.innerHTML = '&#9660; Note Loader';
    } else {
        c.style.display = 'none';
        btn.innerHTML = '&#9654; Note Loader';
    }
}

async function pasteFromClipboard() {
    try {
        var text = await navigator.clipboard.readText();
        document.getElementById('notesInput').value = text;
    } catch (e) {
        alert('Clipboard access denied. Please paste manually (Ctrl+V / Cmd+V).');
    }
}

function clearAll() {
    document.getElementById('notesInput').value = '';
    document.getElementById('renderOutput').innerHTML = '';
}

// --- Parsing helpers ---

function isDropboxVideo(line) {
    return /dropbox\.com\/.*\.(mp4|mov|webm|mkv|avi|m4v)/i.test(line) && /raw=1/i.test(line);
}

function isYouTubeUrl(line) {
    return /(?:youtube\.com\/(?:watch|shorts)|youtu\.be\/)/i.test(line);
}

function extractYouTubeId(url) {
    var m = url.match(/(?:youtube\.com\/watch\?v=|youtube\.com\/shorts\/|youtu\.be\/)([\w-]+)/);
    return m ? m[1] : null;
}

function extractYouTubeTimestamps(url) {
    // Match inline timestamps after the URL, separated by commas
    // e.g. "https://www.youtube.com/watch?v=abc,2:06,2:30,2:55"
    // or   "https://www.youtube.com/watch?v=abc, 4:35, 8:57, 14:58"
    var times = [];
    // Split by comma and check each part after the first (which is the URL)
    var parts = url.split(',');
    // Skip the first part (the URL itself), check remaining for timestamps
    for (var k = 1; k < parts.length; k++) {
        var p = parts[k].trim().replace(/[\[\]]/g, '');
        if (/^\d+:\d{2}$/.test(p) || /^\d+$/.test(p)) {
            times.push({ time: p, label: '' });
        }
    }
    return times;
}

function parseTimeToSeconds(str) {
    str = str.trim();
    var parts = str.split(':');
    if (parts.length === 1) return parseInt(parts[0], 10) || 0;
    if (parts.length === 2) return (parseInt(parts[0], 10) || 0) * 60 + (parseInt(parts[1], 10) || 0);
    if (parts.length === 3) return (parseInt(parts[0], 10) || 0) * 3600 + (parseInt(parts[1], 10) || 0) * 60 + (parseInt(parts[2], 10) || 0);
    return 0;
}

function isAnnotationLine(line) {
    // Lines like "3:59 shai at these times" or "9:45 JLew Ball Handle MasterClass"
    return /^\d+:\d{2}\s+\S/.test(line.trim());
}

function parseAnnotation(line) {
    var m = line.trim().match(/^(\d+:\d{2})\s+(.+)$/);
    if (m) return { time: m[1], label: m[2] };
    return null;
}

function extractDropboxTitle(url) {
    try {
        var decoded = decodeURIComponent(url);
        var m = decoded.match(/\/([^/]+)\.(mp4|mov|webm|mkv|avi|m4v)\?/i);
        if (m) {
            return m[1].replace(/-/g, ' ').replace(/\s+/g, ' ').trim();
        }
    } catch (e) {}
    return 'Video';
}

function isBlankLine(line) {
    return line.trim() === '';
}

function isUrl(line) {
    return /^https?:\/\//i.test(line.trim());
}

// --- Rendering ---

var ytBlockCounter = 0;

function renderNotes() {
    var text = document.getElementById('notesInput').value;
    var output = document.getElementById('renderOutput');
    output.innerHTML = '';
    ytBlockCounter = 0;

    if (!text.trim()) return;

    var lines = text.split('\n');
    var i = 0;

    while (i < lines.length) {
        var line = lines[i].trim();

        // Blank line -> separator
        if (isBlankLine(lines[i])) {
            var sep = document.createElement('div');
            sep.className = 'separator';
            output.appendChild(sep);
            i++;
            continue;
        }

        // Dropbox video
        if (isDropboxVideo(line)) {
            var block = document.createElement('div');
            block.className = 'video-block';

            var vid = document.createElement('video');
            vid.controls = true;
            vid.preload = 'metadata';
            vid.src = line;
            block.appendChild(vid);

            var title = document.createElement('div');
            title.className = 'video-title';
            title.textContent = extractDropboxTitle(line);
            block.appendChild(title);

            output.appendChild(block);
            i++;
            continue;
        }

        // YouTube URL
        if (isYouTubeUrl(line)) {
            var videoId = extractYouTubeId(line);
            if (videoId) {
                var timestamps = extractYouTubeTimestamps(line);

                // Look ahead for annotation lines and merge them
                var j = i + 1;
                while (j < lines.length) {
                    var nextLine = lines[j].trim();
                    if (isBlankLine(lines[j])) break;
                    if (isAnnotationLine(nextLine)) {
                        var ann = parseAnnotation(nextLine);
                        if (ann) {
                            // Check if this time already exists
                            var exists = timestamps.some(function(t) { return t.time === ann.time; });
                            if (exists) {
                                // Update label
                                timestamps.forEach(function(t) {
                                    if (t.time === ann.time && !t.label) t.label = ann.label;
                                });
                            } else {
                                timestamps.push({ time: ann.time, label: ann.label });
                            }
                        }
                        j++;
                    } else if (!isUrl(nextLine) && !isBlankLine(lines[j])) {
                        // Non-URL text after YouTube - could be annotation without time format
                        // Check if it mentions times
                        var timeMatch = nextLine.match(/^(\d+:\d{2})\s*(.*)/);
                        if (timeMatch) {
                            timestamps.push({ time: timeMatch[1], label: timeMatch[2] || '' });
                            j++;
                        } else {
                            break;
                        }
                    } else {
                        break;
                    }
                }

                var blockId = 'yt-' + ytBlockCounter++;
                var ytBlock = document.createElement('div');
                ytBlock.className = 'yt-block';

                var iframe = document.createElement('iframe');
                iframe.id = blockId + '-iframe';
                iframe.src = 'https://www.youtube.com/embed/' + videoId;
                iframe.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture';
                iframe.allowFullscreen = true;
                ytBlock.appendChild(iframe);

                // Time pills bar
                var pillsBar = document.createElement('div');
                pillsBar.className = 'time-pills';
                pillsBar.id = blockId + '-pills';

                var label = document.createElement('span');
                label.className = 'time-pills-label';
                label.textContent = 'Times:';
                pillsBar.appendChild(label);

                timestamps.forEach(function(t) {
                    var pill = createTimePill(t.time, t.label, blockId);
                    pillsBar.appendChild(pill);
                });

                var addBtn = document.createElement('button');
                addBtn.className = 'add-time-btn';
                addBtn.textContent = '+ Add Time';
                addBtn.setAttribute('data-block-id', blockId);
                addBtn.onclick = function() {
                    var bid = this.getAttribute('data-block-id');
                    var input = prompt('Enter times (e.g. "1:00,2:00" or "2:30, nice crossover"):');
                    if (!input) return;
                    var bar = document.getElementById(bid + '-pills');
                    var addButton = this;
                    // Split by comma and process each entry
                    var entries = input.split(',');
                    var pendingTime = null;
                    entries.forEach(function(entry) {
                        entry = entry.trim();
                        if (!entry) return;
                        if (/^\d+:\d{2}$/.test(entry) || /^\d+$/.test(entry)) {
                            // It's a time - flush any pending time first
                            if (pendingTime !== null) {
                                bar.insertBefore(createTimePill(pendingTime, '', bid), addButton);
                            }
                            pendingTime = entry;
                        } else if (pendingTime !== null) {
                            // It's a comment for the pending time
                            bar.insertBefore(createTimePill(pendingTime, entry, bid), addButton);
                            pendingTime = null;
                        }
                    });
                    // Flush last pending time with no comment
                    if (pendingTime !== null) {
                        bar.insertBefore(createTimePill(pendingTime, '', bid), addButton);
                    }
                };
                pillsBar.appendChild(addBtn);

                ytBlock.appendChild(pillsBar);
                output.appendChild(ytBlock);
                i = j;
                continue;
            }
        }

        // Other URL (non-video) - render as link
        if (isUrl(line)) {
            var linkP = document.createElement('p');
            linkP.className = 'text-line';
            var a = document.createElement('a');
            a.href = line;
            a.target = '_blank';
            a.style.color = '#64b5f6';
            a.textContent = line;
            linkP.appendChild(a);
            output.appendChild(linkP);
            i++;
            continue;
        }

        // Plain text - section header if short-ish and standalone, otherwise paragraph
        if (line.length < 60 && !isUrl(line)) {
            var header = document.createElement('div');
            header.className = 'section-header';
            header.textContent = line;
            output.appendChild(header);
        } else {
            var p = document.createElement('p');
            p.className = 'text-line';
            p.textContent = line;
            output.appendChild(p);
        }
        i++;
    }

    // Collapse the loader after render
    document.getElementById('loaderContent').style.display = 'none';
    document.getElementById('toggleBtn').innerHTML = '&#9654; Note Loader';
}

function createTimePill(time, label, blockId) {
    var pill = document.createElement('button');
    pill.className = 'time-pill';
    pill.textContent = label ? time + ' - ' + label : time;
    pill.setAttribute('data-time', time);
    pill.setAttribute('data-block-id', blockId);
    pill.onclick = function() {
        var t = this.getAttribute('data-time');
        var bid = this.getAttribute('data-block-id');
        var seconds = parseTimeToSeconds(t);
        var iframe = document.getElementById(bid + '-iframe');
        var src = iframe.src.split('?')[0];
        iframe.src = src + '?start=' + seconds + '&autoplay=1';
    };
    return pill;
}

// Auto-open the loader on page load
toggleLoader();
</script>

</body>
</html>
